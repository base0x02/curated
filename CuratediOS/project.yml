name: Curated
options:
  bundleIdPrefix: local.curated
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2"
    CURRENT_PROJECT_VERSION: "32"
    DEVELOPMENT_TEAM: "" # set your own Apple team ID
    CODE_SIGN_STYLE: Automatic
targets:
  Curated:
    type: application
    platform: iOS
    sources:
      - path: Curated/Sources
      - path: Curated/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.curated.ios
        PRODUCT_NAME: Curated
        ASSETCATALOG_COMPILER_APPICON_NAME: CuratedAppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Curated
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Upright, except a long video full screen (OrientationLock).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Curated connects to Curated on your Mac to sync videos.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Curated/Info.plist
      properties:
        NSBonjourServices: [_curated._tcp]
        UIAppFonts: [LilitaOne-Regular.ttf]
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [local.curated.ios.sync]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  CuratedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CuratedUITests]
    dependencies:
      - target: Curated
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Curated
